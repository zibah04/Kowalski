name: Build Kowalski for Windows
on:
  workflow_dispatch:
  push:
    branches: [main]
jobs:
  build:
    runs-on: windows-2022
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          architecture: x64
      - name: Install tools
        shell: pwsh
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt pyinstaller==6.16.0
      - name: Run automated tests
        env:
          QT_QPA_PLATFORM: offscreen
        run: python -m unittest discover -s tests -v
      - name: Compile Windows executable
        run: python -m PyInstaller --noconfirm --clean --windowed --onedir --name Kowalski main.py
      - name: ZIP application folder
        shell: pwsh
        run: Compress-Archive -Path dist/Kowalski/* -DestinationPath Kowalski-Windows-x64.zip -Force
      - uses: actions/upload-artifact@v4
        with:
          name: Kowalski-Windows-x64
          path: Kowalski-Windows-x64.zip
