name: Build Kowalski for Windows
on:
  workflow_dispatch:
  push:
    branches: [main]
jobs:
  build:
    runs-on: windows-2022
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          architecture: x64
      - name: Install tools
        shell: pwsh
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt pyinstaller==6.16.0
      - name: Run automated tests
        env:
          QT_QPA_PLATFORM: offscreen
        run: python -m unittest discover -s tests -v
      - name: Compile Windows executable
        run: python -m PyInstaller --noconfirm --clean --windowed --onedir --name Kowalski main.py
      - name: ZIP application folder
        shell: pwsh
        run: Compress-Archive -Path dist/Kowalski/* -DestinationPath Kowalski-Windows-x64.zip -Force
      - name: Compile Windows installer
        shell: pwsh
        run: |
          $compiler = Join-Path ${env:ProgramFiles(x86)} 'Inno Setup 6\ISCC.exe'
          if (-not (Test-Path $compiler)) {
            choco install innosetup --no-progress -y
          }
          if (-not (Test-Path $compiler)) {
            throw 'Inno Setup compiler is missing.'
          }
          & $compiler installer\kowalski.iss
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          if (-not (Test-Path installer-output\Kowalski-Setup-v1.1.0-Windows-x64.exe)) {
            throw 'Expected installer output is missing.'
          }
      - uses: actions/upload-artifact@v4
        with:
          name: Kowalski-Windows-x64
          path: Kowalski-Windows-x64.zip
      - uses: actions/upload-artifact@v4
        with:
          name: Kowalski-Windows-Installer
          path: installer-output/Kowalski-Setup-v1.1.0-Windows-x64.exe
          if-no-files-found: error
