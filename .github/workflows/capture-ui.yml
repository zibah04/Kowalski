name: Capture Kowalski UI screenshots

on:
  push:
    branches: [main]
    paths:
      - "tools/capture_ui.py"
      - ".github/workflows/capture-ui.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  capture:
    runs-on: windows-2022
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          architecture: x64
      - name: Install Kowalski dependencies
        run: python -m pip install -r requirements.txt
      - name: Render actual Qt application screenshots
        env:
          QT_QPA_PLATFORM: offscreen
        run: python tools/capture_ui.py
      - name: Upload PNG screenshots
        uses: actions/upload-artifact@v4
        with:
          name: Kowalski-UI-Screenshots
          path: docs/screenshots/*.png
          if-no-files-found: error
      - name: Publish screenshots in repository
        shell: pwsh
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/screenshots/
          git diff --cached --quiet
          if ($LASTEXITCODE -eq 1) {
            git commit -m "docs: capture actual Kowalski Windows UI [skip ci]"
            git push origin HEAD:main
            if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          }
